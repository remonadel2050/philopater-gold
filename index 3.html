<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فيلوباتير">
<meta name="theme-color" content="#120d08">
<title>فيلوباتير للذهب</title>
<style>
:root{--gold:#d9ad4f;--gold2:#f3d47c;--cream:#fff8ea;--ink:#1e140b;--line:#dfc48a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:14px;max-width:560px;margin:auto;background:linear-gradient(180deg,#0c0804 0,#201307 190px,#f3e2c3 190px,#f6eddc 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}
.header{color:var(--gold2);text-align:center;padding:10px 0 16px}.logo{font-size:40px;font-weight:950}.sub{font-size:15px;font-weight:800;color:#f1cf74}
.app{background:var(--cream);border:1px solid #ead19a;border-radius:28px;padding:16px;box-shadow:0 14px 38px rgba(0,0,0,.38)}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.switch button{border:1px solid var(--line);border-radius:17px;padding:15px;font-size:23px;font-weight:950;background:#f0dfbd;color:#5a3a12}
.switch button.on.sell{background:linear-gradient(180deg,#149c51,#087236);color:white}.switch button.on.buy{background:linear-gradient(180deg,#d8841c,#9f5108);color:white}
label{display:block;margin:13px 0 7px;font-size:17px;font-weight:950;color:#2a1b0b}
input{width:100%;border:2px solid var(--line);border-radius:16px;padding:14px;font-size:24px;background:white;outline:none;text-align:right}
input.en{direction:ltr;text-align:left;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.fixed{background:linear-gradient(135deg,#100a05,#2d1a09);color:#f4d375;text-align:center;font-size:36px;font-weight:950;border-color:var(--gold);direction:ltr}
.qtybox{display:grid;grid-template-columns:82px 1fr 82px;gap:10px}
.qtybox button{border:0;border-radius:18px;background:#14100b;color:white;font-size:40px;font-weight:950;min-height:62px}
#qty{text-align:center;font-size:36px;font-weight:950;direction:ltr}
.result{margin-top:13px;background:white;border:1px solid #e2c58d;border-radius:22px;padding:16px;text-align:center}
.result b{display:block;color:#775b31;font-size:17px;margin-bottom:8px}
.result span{font-size:34px;font-weight:950;direction:ltr;display:block}
.weight span{color:#08783a}.money span{color:#a87500}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}
.actions button{border:0;border-radius:17px;padding:15px 8px;font-size:18px;font-weight:950}
.wa{background:#19a957;color:white}.copy{background:#14100b;color:white}.save{background:#d9ad4f;color:#241506}.clear{background:#ecd9b4;color:#4c320f}
.preview{margin-top:14px;background:#fff;border:1px dashed #bd9551;border-radius:20px;padding:14px;white-space:pre-wrap;line-height:1.7;font-size:17px;min-height:145px}
.toast{display:none;position:fixed;bottom:24px;left:18px;right:18px;background:#14100b;color:white;padding:13px;border-radius:17px;text-align:center;font-weight:950;z-index:10}
.note{text-align:center;color:#70542a;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="header"><div class="logo">فيلوباتير</div><div class="sub">بيع وشراء الذهب</div></div>

<div class="app">
  <label>اسم العميل</label>
  <input id="client" placeholder="اكتب اسم العميل" autocomplete="off" enterkeyhint="next">

  <div class="switch">
    <button id="sellBtn" class="sell on" type="button">بيع</button>
    <button id="buyBtn" class="buy" type="button">شراء</button>
  </div>

  <label>الوزن الثابت</label>
  <input class="fixed en" value="1137.15" readonly>

  <label>الكمية</label>
  <div class="qtybox">
    <button id="minusBtn" type="button">−</button>
    <input id="qty" class="en" value="1" inputmode="numeric" pattern="[0-9]*" lang="en" enterkeyhint="next">
    <button id="plusBtn" type="button">+</button>
  </div>

  <label>الوزن</label>
  <input id="manualWeight" class="en" type="text" inputmode="decimal" pattern="[0-9.]*" lang="en" placeholder="0.00" enterkeyhint="next">

  <label>سعر الجرام</label>
  <input id="price" class="en" type="text" inputmode="decimal" pattern="[0-9.]*" lang="en" placeholder="0.00" enterkeyhint="done">

  <div class="result weight"><b>إجمالي الوزن</b><span id="totalWeight">0.00 جم</span></div>
  <div class="result money"><b>إجمالي السعر</b><span id="totalMoney">0 جنيه</span></div>

  <div class="actions">
    <button id="waBtn" class="wa" type="button">إرسال للحسابات</button>
    <button id="copyBtn" class="copy" type="button">نسخ</button>
    <button id="saveBtn" class="save" type="button">حفظ</button>
  </div>
  <div class="actions">
    <button id="clearBtn" class="clear" type="button">مسح العملية</button>
    <button id="resetQtyBtn" class="clear" type="button">تصفير الوزن</button>
    <button id="focusBtn" class="clear" type="button">اسم جديد</button>
  </div>

  <div class="preview" id="preview"></div>
  <div class="note">Enter يتحرك بين الخانات: الاسم ← الكمية ← الوزن ← سعر الجرام — زر إرسال للحسابات ينسخ الرسالة ويفتح الجروب</div>
</div>

<div class="toast" id="toast">تم ✅</div>

<script>
(function(){
var FIXED=1137.15, deal=localStorage.getItem('philopater_deal')||'بيع';
var ACCOUNTS_GROUP_LINK='https://chat.whatsapp.com/DrrM4BzJEC3CEB53gvz0yK?s=sh&p=i&mlu=2';
var OPS='philopater_ops_v2', CLIENTS='philopater_clients_v2';
function id(x){return document.getElementById(x)}
function get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function cleanNumberText(v){return String(v||'').replace(/[^\d.]/g,'')}
function num(v){return parseFloat(cleanNumberText(v))||0}
function qnum(){return Math.max(0,parseInt(cleanNumberText(id('qty').value)||'0',10)||0)}
function fmt(v){return Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function money(v){return Number(v).toLocaleString('en-US',{maximumFractionDigits:0})}

id('price').value=localStorage.getItem('philopater_price')||'';

function setDeal(t){
  deal=t; localStorage.setItem('philopater_deal',t);
  id('sellBtn').classList.toggle('on',t==='بيع');
  id('buyBtn').classList.toggle('on',t==='شراء');
  update();
}
function calc(){
  var q=qnum();
  var manual=num(id('manualWeight').value);
  var price=num(id('price').value);
  var totalWeight=(FIXED*q)+manual;
  var totalMoney=totalWeight*price;
  if(id('price').value) localStorage.setItem('philopater_price',cleanNumberText(id('price').value));
  return {q:q,manual:manual,price:price,totalWeight:totalWeight,totalMoney:totalMoney};
}
function message(){
  var c=calc();
  return '🧾 '+deal+' ذهب\n\n'+
  '👤 اسم العميل: '+(id('client').value||'---')+'\n'+
  '⚖️ الوزن الثابت: '+fmt(FIXED)+' جم\n'+
  '🔢 الكمية: '+c.q+'\n'+
  '⚖️ الوزن: '+fmt(c.manual)+' جم\n\n'+
  '⚖️ إجمالي الوزن: '+fmt(c.totalWeight)+' جم\n'+
  '💵 سعر الجرام: '+(id('price').value||'---')+'\n'+
  '💰 إجمالي السعر: '+money(c.totalMoney)+' جنيه\n\n'+
  'فيلوباتير للذهب';
}
function update(){
  id('qty').value=qnum();
  var c=calc();
  id('totalWeight').textContent=fmt(c.totalWeight)+' جم';
  id('totalMoney').textContent=money(c.totalMoney)+' جنيه';
  id('preview').textContent=message();
}
function toast(t){id('toast').textContent=t;id('toast').style.display='block';setTimeout(function(){id('toast').style.display='none'},1300)}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');toast('تم النسخ ✅')}catch(e){alert(text)}document.body.removeChild(ta)}
function copyMessage(){var text=message();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('تم النسخ ✅')}).catch(function(){fallbackCopy(text)})}else fallbackCopy(text)}
function saveClient(){var name=(id('client').value||'').trim();if(!name)return;var a=get(CLIENTS,[]).filter(function(x){return x!==name});a.unshift(name);set(CLIENTS,a.slice(0,100))}
function saveOperation(){
  saveClient();
  var c=calc(), ops=get(OPS,[]);
  ops.unshift({date:new Date().toLocaleString('ar-EG'),deal:deal,client:id('client').value,fixed:FIXED,qty:c.q,weight:c.manual,totalWeight:c.totalWeight,price:id('price').value,totalMoney:c.totalMoney});
  set(OPS,ops);
  toast('تم حفظ العملية ✅');
}
function sendWhatsApp(){
  saveOperation();
  copyMessage();
  toast('تم نسخ الرسالة ✅ افتح الجروب واعمل لصق ثم إرسال');
  setTimeout(function(){location.href=ACCOUNTS_GROUP_LINK},350);
}
function clearForm(){id('client').value='';id('qty').value=1;id('manualWeight').value='';update();id('client').focus()}
function resetWeight(){id('qty').value=0;id('manualWeight').value='';update();id('manualWeight').focus()}
function onlyEnglishNumbers(input){input.value=cleanNumberText(input.value)}
function nextOnEnter(current,next){
  current.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      e.preventDefault();
      if(next==='whatsapp'){id('waBtn').focus();return}
      id(next).focus();
    }
  });
}
id('sellBtn').onclick=function(){setDeal('بيع')};
id('buyBtn').onclick=function(){setDeal('شراء')};
id('minusBtn').onclick=function(){id('qty').value=Math.max(0,qnum()-1);update()};
id('plusBtn').onclick=function(){id('qty').value=qnum()+1;update()};
id('copyBtn').onclick=copyMessage;
id('waBtn').onclick=sendWhatsApp;
id('saveBtn').onclick=saveOperation;
id('clearBtn').onclick=clearForm;
id('resetQtyBtn').onclick=resetWeight;
id('focusBtn').onclick=function(){id('client').value='';id('client').focus();update()};

['qty','manualWeight','price'].forEach(function(x){id(x).addEventListener('input',function(){onlyEnglishNumbers(id(x));update()})});
id('client').addEventListener('input',update);

nextOnEnter(id('client'),'qty');
nextOnEnter(id('qty'),'manualWeight');
nextOnEnter(id('manualWeight'),'price');
nextOnEnter(id('price'),'whatsapp');

setDeal(deal); update();
})();
</script>
</body>
</html>
