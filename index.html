<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فيلوباتير">
<meta name="theme-color" content="#120d08">
<title>فيلوباتير للذهب</title>
<style>
:root{--gold:#d9ad4f;--gold2:#f3d47c;--cream:#fff8ea;--ink:#1e140b;--line:#dfc48a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:14px;max-width:560px;margin:auto;background:linear-gradient(180deg,#0c0804 0,#201307 190px,#f3e2c3 190px,#f6eddc 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}
.header{color:var(--gold2);text-align:center;padding:10px 0 16px}.logo{font-size:40px;font-weight:950}.sub{font-size:15px;font-weight:800;color:#f1cf74}
.app{background:var(--cream);border:1px solid #ead19a;border-radius:28px;padding:16px;box-shadow:0 14px 38px rgba(0,0,0,.38)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tabs button{border:0;border-radius:15px;padding:13px;font-size:18px;font-weight:950;background:#ecd9b4;color:#4c320f}.tabs button.active{background:#14100b;color:white}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}.switch button{border:1px solid var(--line);border-radius:17px;padding:15px;font-size:23px;font-weight:950;background:#f0dfbd;color:#5a3a12}
.switch button.on.sell{background:linear-gradient(180deg,#149c51,#087236);color:white}.switch button.on.buy{background:linear-gradient(180deg,#d8841c,#9f5108);color:white}
label{display:block;margin:13px 0 7px;font-size:17px;font-weight:950;color:#2a1b0b}
input{width:100%;border:2px solid var(--line);border-radius:16px;padding:14px;font-size:24px;background:white;outline:none;text-align:right}
.fixed{background:linear-gradient(135deg,#100a05,#2d1a09);color:#f4d375;text-align:center;font-size:36px;font-weight:950;border-color:var(--gold)}
.qtybox{display:grid;grid-template-columns:82px 1fr 82px;gap:10px}.qtybox button{border:0;border-radius:18px;background:#14100b;color:white;font-size:40px;font-weight:950;min-height:62px}
#qty{text-align:center;font-size:36px;font-weight:950}
.metric{background:white;border:1px solid #e2c58d;border-radius:19px;padding:13px;text-align:center;margin-top:11px}.metric b{display:block;color:#775b31;font-size:14px;margin-bottom:5px}.metric span{font-size:26px;font-weight:950;direction:ltr;display:block}
.big{margin-top:11px;background:linear-gradient(90deg,#ecf9ef,#fffdf8);border:1px solid #bfe1c8;border-radius:20px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.big b{font-size:18px}.big span{font-size:29px;font-weight:950;color:#08783a;direction:ltr}.money{background:linear-gradient(90deg,#fff4d3,#fffdf8);border-color:#ead19a}.money span{color:#a87500}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}.actions button,.historyActions button{border:0;border-radius:17px;padding:15px 8px;font-size:18px;font-weight:950}
.wa{background:#19a957;color:white}.copy{background:#14100b;color:white}.save{background:#d9ad4f;color:#241506}.clear{background:#ecd9b4;color:#4c320f}.danger{background:#b91c1c;color:white}.excel{background:#0b7d3a;color:white}
.preview{margin-top:14px;background:#fff;border:1px dashed #bd9551;border-radius:20px;padding:14px;white-space:pre-wrap;line-height:1.7;font-size:17px;min-height:160px}
.toast{display:none;position:fixed;bottom:24px;left:18px;right:18px;background:#14100b;color:white;padding:13px;border-radius:17px;text-align:center;font-weight:950;z-index:10}
.suggest{display:flex;gap:6px;overflow:auto;margin-top:8px}.suggest button{white-space:nowrap;border:1px solid #d8bd84;border-radius:999px;background:#fff;padding:9px 12px;font-weight:800}
.historyActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.op{background:#fff;border:1px solid #e0c891;border-radius:16px;padding:12px;margin-bottom:9px}.op b{display:block;margin-bottom:5px}.op small{color:#765a2e}.op .line{display:flex;justify-content:space-between;gap:10px;margin:4px 0}.op button{margin-top:8px;border:0;border-radius:12px;padding:9px 12px;background:#14100b;color:white;font-weight:900}
.hidden{display:none}
</style>
</head>
<body>
<div class="header"><div class="logo">فيلوباتير</div><div class="sub">مبيعات وشراء الذهب</div></div>
<div class="app">
<div class="tabs"><button id="mainTab" class="active">عملية جديدة</button><button id="historyTab">السجل</button></div>

<div id="mainView">
<div class="switch"><button id="sellBtn" class="sell on" type="button">بيع</button><button id="buyBtn" class="buy" type="button">شراء</button></div>

<label>اسم العميل</label>
<input id="client" placeholder="اكتب اسم العميل" list="clientsList" autocomplete="off">
<datalist id="clientsList"></datalist>
<div class="suggest" id="suggestions"></div>

<label>الوزن الثابت</label><input class="fixed" value="1137.15" readonly>

<label>الكمية</label>
<div class="qtybox"><button id="minusBtn" type="button">−</button><input id="qty" value="1" inputmode="numeric"><button id="plusBtn" type="button">+</button></div>

<label>الوزن المتغير</label><input id="variable" type="number" inputmode="decimal" step="0.001" placeholder="مثال: 25.50">

<div class="metric"><b>إجمالي الوزن الثابت</b><span id="fixedTotal">0 جم</span></div>
<div class="metric"><b>الوزن المتغير</b><span id="varTotal">0 جم</span></div>
<div class="big"><b>الوزن الإجمالي</b><span id="grandTotal">0 جم</span></div>

<label>سعر الجرام</label><input id="price" type="number" inputmode="decimal" placeholder="اكتب سعر الجرام">
<div class="big money"><b>الإجمالي جنيه</b><span id="totalMoney">0</span></div>

<div class="actions"><button id="waBtn" class="wa" type="button">واتساب</button><button id="copyBtn" class="copy" type="button">نسخ</button><button id="saveBtn" class="save" type="button">حفظ</button></div>
<div class="actions"><button id="clearBtn" class="clear" type="button">مسح العملية</button><button id="undoBtn" class="clear" type="button">آخر عملية</button><button id="excelBtn1" class="excel" type="button">Excel</button></div>
<div class="preview" id="preview"></div>
</div>

<div id="historyView" class="hidden">
<div class="historyActions"><button id="exportBtn" class="excel">تصدير Excel</button><button id="clearHistoryBtn" class="danger">مسح السجل</button><button id="backBtn" class="copy">رجوع</button></div>
<div id="summary" class="metric"></div>
<div id="historyList"></div>
</div>
</div>
<div class="toast" id="toast">تم ✅</div>

<script>
(function(){
var FIXED=1137.15, deal=localStorage.getItem('philopater_deal')||'بيع';
var CLIENTS='philopater_clients_v1', OPS='philopater_ops_v1';
function id(x){return document.getElementById(x)}
function get(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function num(v){return parseFloat(String(v||'').replace(',','.'))||0}
function qnum(){return Math.max(0,parseInt(id('qty').value||'0',10)||0)}
function fmt(v){return Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function money(v){return Number(v).toLocaleString('en-US',{maximumFractionDigits:0})}
id('price').value=localStorage.getItem('philopater_price')||'';

function setDeal(t){deal=t;localStorage.setItem('philopater_deal',t);id('sellBtn').classList.toggle('on',t==='بيع');id('buyBtn').classList.toggle('on',t==='شراء');update()}
function calc(){var q=qnum(), variable=num(id('variable').value), price=num(id('price').value), fixedTotal=FIXED*q, grand=fixedTotal+variable, total=grand*price;if(id('price').value)localStorage.setItem('philopater_price',id('price').value);return{q:q,variable:variable,price:price,fixedTotal:fixedTotal,grand:grand,total:total}}
function message(){var c=calc();return '🧾 '+deal+' ذهب\n\n👤 اسم العميل: '+(id('client').value||'---')+'\n⚖️ الوزن الثابت: '+fmt(FIXED)+' جم\n🔢 الكمية: '+c.q+'\n⚖️ إجمالي الثابت: '+fmt(c.fixedTotal)+' جم\n✍️ الوزن المتغير: '+fmt(c.variable)+' جم\n\n⚖️ الوزن الإجمالي: '+fmt(c.grand)+' جم\n💵 سعر الجرام: '+(id('price').value||'---')+'\n💰 الإجمالي: '+money(c.total)+' جنيه\n\nفيلوباتير للذهب'}
function update(){var c=calc();id('qty').value=c.q;id('fixedTotal').textContent=fmt(c.fixedTotal)+' جم';id('varTotal').textContent=fmt(c.variable)+' جم';id('grandTotal').textContent=fmt(c.grand)+' جم';id('totalMoney').textContent=money(c.total);id('preview').textContent=message();renderSuggestions()}
function toast(t){id('toast').textContent=t;id('toast').style.display='block';setTimeout(function(){id('toast').style.display='none'},1300)}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');toast('تم النسخ ✅')}catch(e){alert(text)}document.body.removeChild(ta)}
function copyMessage(){var text=message();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('تم النسخ ✅')}).catch(function(){fallbackCopy(text)})}else fallbackCopy(text)}
function saveClient(name){name=(name||'').trim();if(!name)return;var a=get(CLIENTS,[]).filter(function(x){return x!==name});a.unshift(name);set(CLIENTS,a.slice(0,100));renderClients()}
function saveOperation(){var c=calc(), name=id('client').value.trim();saveClient(name);var ops=get(OPS,[]);ops.unshift({date:new Date().toLocaleString('ar-EG'),deal:deal,client:name,fixed:FIXED,qty:c.q,fixedTotal:c.fixedTotal,variable:c.variable,grand:c.grand,price:id('price').value,total:c.total,msg:message()});set(OPS,ops);toast('تم حفظ العملية ✅');renderHistory()}
function renderClients(){var a=get(CLIENTS,[]), dl=id('clientsList');dl.innerHTML='';a.forEach(function(n){var o=document.createElement('option');o.value=n;dl.appendChild(o)})}
function renderSuggestions(){var q=(id('client').value||'').trim(), a=get(CLIENTS,[]), box=id('suggestions');box.innerHTML='';a.filter(function(n){return !q||n.indexOf(q)===0}).slice(0,8).forEach(function(n){var b=document.createElement('button');b.textContent=n;b.onclick=function(){id('client').value=n;update()};box.appendChild(b)})}
function sendWhatsApp(){saveOperation();copyMessage();setTimeout(function(){location.href='whatsapp://send?text='+encodeURIComponent(message())},250)}
function clearForm(){id('client').value='';id('qty').value=1;id('variable').value='';update();id('client').focus()}
function lastOp(){var ops=get(OPS,[]);if(!ops.length){toast('لا يوجد عمليات');return}var o=ops[0];setDeal(o.deal);id('client').value=o.client;id('qty').value=o.qty;id('variable').value=o.variable;id('price').value=o.price;update();toast('تم استرجاع آخر عملية')}
function show(tab){id('mainView').classList.toggle('hidden',tab!=='main');id('historyView').classList.toggle('hidden',tab!=='history');id('mainTab').classList.toggle('active',tab==='main');id('historyTab').classList.toggle('active',tab==='history');if(tab==='history')renderHistory()}
function renderHistory(){var ops=get(OPS,[]), list=id('historyList');list.innerHTML='';var sellW=0,buyW=0,sellM=0,buyM=0;ops.forEach(function(o,i){if(o.deal==='بيع'){sellW+=o.grand;sellM+=o.total}else{buyW+=o.grand;buyM+=o.total}var d=document.createElement('div');d.className='op';d.innerHTML='<b>'+o.deal+' - '+(o.client||'---')+'</b><small>'+o.date+'</small><div class="line"><span>الوزن</span><b>'+fmt(o.grand)+' جم</b></div><div class="line"><span>السعر</span><b>'+o.price+'</b></div><div class="line"><span>الإجمالي</span><b>'+money(o.total)+' جنيه</b></div><button data-i="'+i+'">مراجعة</button>';list.appendChild(d);d.querySelector('button').onclick=function(){var x=ops[i];setDeal(x.deal);id('client').value=x.client;id('qty').value=x.qty;id('variable').value=x.variable;id('price').value=x.price;update();show('main')}});id('summary').innerHTML='<b>ملخص السجل</b><span>بيع: '+fmt(sellW)+' جم / '+money(sellM)+' جنيه</span><span>شراء: '+fmt(buyW)+' جم / '+money(buyM)+' جنيه</span><span>عدد العمليات: '+ops.length+'</span>'}
function csvCell(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
function exportExcel(){var ops=get(OPS,[]);if(!ops.length){toast('لا يوجد عمليات');return}var rows=[['التاريخ','نوع العملية','اسم العميل','الوزن الثابت','الكمية','إجمالي الثابت','الوزن المتغير','الوزن الإجمالي','سعر الجرام','الإجمالي جنيه']];ops.slice().reverse().forEach(function(o){rows.push([o.date,o.deal,o.client,o.fixed,o.qty,o.fixedTotal,o.variable,o.grand,o.price,o.total])});var csv='\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\n');var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='philopater_gold_sales.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);toast('تم تجهيز ملف Excel ✅')}
id('sellBtn').onclick=function(){setDeal('بيع')};id('buyBtn').onclick=function(){setDeal('شراء')};id('minusBtn').onclick=function(){id('qty').value=Math.max(0,qnum()-1);update()};id('plusBtn').onclick=function(){id('qty').value=qnum()+1;update()};
id('copyBtn').onclick=copyMessage;id('waBtn').onclick=sendWhatsApp;id('saveBtn').onclick=saveOperation;id('clearBtn').onclick=clearForm;id('undoBtn').onclick=lastOp;id('excelBtn1').onclick=exportExcel;
id('mainTab').onclick=function(){show('main')};id('historyTab').onclick=function(){show('history')};id('backBtn').onclick=function(){show('main')};id('exportBtn').onclick=exportExcel;
id('clearHistoryBtn').onclick=function(){if(confirm('تمسح كل السجل؟')){localStorage.removeItem(OPS);renderHistory();toast('تم مسح السجل')}};
['client','qty','variable','price'].forEach(function(x){id(x).addEventListener('input',update)});renderClients();setDeal(deal);update();
})();
</script>
</body></html>
